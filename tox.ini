[tox]
requires =
    tox>=4
env_list =
    py{311,312,313,314}
    lint
skip_missing_interpreters = True
isolated_build = True
minversion = 4.0.0

[testenv]
description = run unit tests, including Qt controller tests, without native GUI scenarios
commands =
    pytest {posargs:tests}
deps =
    -r requirements.txt
    -r tests/requirements.txt
setenv =
    PIP_CACHE_DIR = {toxworkdir}/pip-cache
    PYTHONPATH = {toxinidir}{:}{toxinidir}/src
skip_install = true


[testenv:nogpio]
description = run unit tests without native GUI scenarios or Raspberry Pi GPIO dependencies
commands =
    pytest {posargs:tests}
deps =
    -r requirements-nogpio.txt
    -r tests/requirements.txt
setenv =
    PIP_CACHE_DIR = {toxworkdir}/pip-cache
    PYTHONPATH = {toxinidir}{:}{toxinidir}/src
skip_install = true


[testenv:qt-gui]
description = run native Qt integration scenarios once using the host Python
base_python = python3
deps =
    -r requirements-nogpio.txt
    -r tests/requirements.txt
commands =
    pytest -o addopts= -m qt_gui {posargs:tests/ui}


[testenv:lint]
description = run linter
skip_install = true
commands =
    ruff check --output-format=github --target-version=py311
    ruff format --check --diff --target-version=py311
deps =
    ruff
