name: release.yml
on:
  push:
    tags:
      - '*'

jobs:
  build:
    name: Build pytrain-ogr distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install pypa/build
        run: python3 -m pip install build
      - name: Build a binary wheel and a source tarball
        run: python3 -m build
      - name: Store the distribution packages
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  build-deck:
    name: Build pytrain-ogr-deck distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install pypa/build
        # setuptools-scm is needed outside the build as well: build_deck.py reads the
        # version before it rewrites pyproject.toml, so the rewrite cannot make the
        # working tree look dirty and add a local segment PyPI rejects
        run: python3 -m pip install build setuptools-scm
      - name: Build a binary wheel and a source tarball
        run: python3 scripts/build_deck.py --outdir dist-deck
      - name: Store the distribution packages
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions-deck
          path: dist-deck/

  pypi-publish:
    name: Upload release to PyPI
    needs:
      - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pytrain-ogr
    permissions:
      id-token: write
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  pypi-publish-deck:
    name: Upload pytrain-ogr-deck release to PyPI
    needs:
      - build-deck
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pytrain-ogr-deck
    permissions:
      id-token: write
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v7
        with:
          name: python-package-distributions-deck
          path: dist/
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  notify-pycab:
    name: Trigger PyCab Flatpak release
    needs:
      - pypi-publish
      - pypi-publish-deck
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch PyCab release after both PyPI publications
        env:
          PYCAB_DISPATCH_TOKEN: ${{ secrets.PYCAB_DISPATCH_TOKEN }}
          PYTRAIN_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$PYCAB_DISPATCH_TOKEN" ]]; then
            echo "::notice::PYCAB_DISPATCH_TOKEN not configured; scheduled PyCab polling remains available."
            exit 0
          fi
          [[ "$PYTRAIN_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::notice::Skipping PyCab dispatch for non-numeric tag: $PYTRAIN_TAG"
            exit 0
          }
          GH_TOKEN="$PYCAB_DISPATCH_TOKEN" gh api \
            --method POST \
            repos/cdswindell/PyCab-Flatpak/dispatches \
            -f event_type=pytrain-release \
            -f "client_payload[version]=$PYTRAIN_TAG"
          echo "Dispatched PyCab release for PyTrain $PYTRAIN_TAG"
