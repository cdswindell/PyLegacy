[build-system]
requires = ["setuptools>=75.0", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "pytrain-ogr"
dynamic = ["version"]
authors = [
    { name = "Dave Swindell", email = "pytraininfo@gmail.com" },
]
description = "Control Lionel TMCC/Legacy engines, switches, and accesseries from a Raspberry Pi"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Other Audience",
    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
license = { file = "LICENSE" }

dependencies = [
    "RPLCD>= 1.4.0",
    "colorzero >= 2.0",
    "gpiozero >= 2.0.1",
    "guizero >= 1.6.0",
    "luma.oled >= 3.15.0",
    "psutil >= 5.9.8",
    "pygame-ce >= 2.5.6",
    "python-dotenv >= 1.2.3",
    "pyserial >= 3.5",
    "range-key-dict >= 1.1",
    "requests >= 2.34.2",
    "rpi-lgpio >= 0.6; platform_system == 'Linux'",
    "setuptools >= 84.0.0",
    "setuptools_scm >= 10.2.0",
    "smbus2 >= 0.6.1",
    "zeroconf >= 0.150.2",
    "spidev >= 3.8.0; platform_system == 'Linux'"
]

[project.optional-dependencies]
qt-gui = [
    "PySide6 >= 6.10, < 7",
]

keywords = [
    "automation",
    "interactive",
    "control",
    "control panel",
    "legacy",
    "lionel",
    "model railroad",
    "o-gauge",
    "raspberry pi",
    "tmcc",
    "trains",
]

# Definition of the Steam Deck variant of this package. It is built from this very same
# pyproject.toml by scripts/build_deck.py, which applies the overrides below just long enough
# to produce the pytrain-ogr-deck artifacts. This table is inert as far as the build backend
# is concerned; the standard pytrain-ogr build (python3 -m build, pip install .) ignores it.
[tool.pytrain.deck]
name = "pytrain-ogr-deck"
description = "Control Lionel TMCC/Legacy engines, switches, and accessories from a Steam Deck or Linux PC"
exclude-dependencies = [
    "rpi-lgpio",
    "spidev",
]

[tool.setuptools_scm]
version_file = "src/pytrain/_version.py"
version_scheme = "only-version"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
install = ["*.template", "*.jpg", "*.png", "*.ttf"]
"pytrain.gui" = ["fonts/**/*.ttf"]
"pytrain.gui.controller" = ["*.json"]
"pytrain_ui.qt.qml" = ["*.qml"]

[project.scripts]
pytrain = "pytrain:main"
pycab = "pytrain.cli.pycab:main"
pycab-qt = "pytrain_ui.qt.app:main"
configure = "pytrain.cli.configure:main"
lcs = "pytrain.cli.lcs:main"
make_gui = "pytrain.cli.make_gui:main"
make_service = "pytrain.cli.make_service:main"
pycache = "pytrain.cli.cache:main"
pyclear = "pytrain.cli.clear:main"
pylcs = "pytrain.cli.lcs:main"
piconfig = "pytrain.cli.piconfig:main"
reindex = "pytrain.cli.reindex:main"

[project.urls]
Homepage = "https://github.com/cdswindell/PyLegacy"
Source = "https://github.com/cdswindell/PyLegacy"
Issues = "https://github.com/cdswindell/PyLegacy/issues"

[tool.ruff]
line-length = 120
extend-exclude = ["test", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["F403", "F405"]
