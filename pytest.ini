[pytest]
pythonpath = . ./src
addopts = -m "not qt_gui"
markers =
    qt_gui: native Qt integration scenarios (run separately with tox -e qt-gui)
    smoke: curated existing cases for quick development feedback (opt in with -m smoke)
    allow_thread: allow a test to run the real StartupState background thread
    timeout(duration): document tests that expect a bounded runtime
